services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnsim
      POSTGRES_USER: tnsim
      POSTGRES_PASSWORD: ${TNSIM_DB_PASSWORD:?Set TNSIM_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnsim -d tnsim"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: tnsim
      POSTGRES_USER: tnsim
      POSTGRES_PASSWORD: ${TNSIM_DB_PASSWORD:?Set TNSIM_DB_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
