[tool.poetry]
name = "balansis"
version = "1.2.0"
description = "Scientific Python library for explicit compensation, singular arithmetic, and formally audited numerical semantics"
authors = ["Andrey Tikhonov <andrew@xteam.pro>"]
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/StudyLabPro/Balansis"
repository = "https://github.com/StudyLabPro/Balansis"
documentation = "https://github.com/StudyLabPro/Balansis/tree/master/docs"
packages = [{include = "balansis"}]
include = [
    {path = "balansis/py.typed", format = ["sdist", "wheel"]},
    {path = "LICENSE", format = ["sdist", "wheel"]},
    {path = "NOTICE", format = ["sdist", "wheel"]},
    {path = "LICENSING.md", format = ["sdist", "wheel"]},
    {path = "COMMERCIAL_LICENSE.md", format = ["sdist", "wheel"]},
    {path = "CLA.md", format = ["sdist", "wheel"]},
    {path = "CONTRIBUTING.md", format = ["sdist", "wheel"]},
    {path = "SECURITY.md", format = ["sdist", "wheel"]},
    {path = "ORDER_FORM_TEMPLATE.md", format = ["sdist", "wheel"]},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["mathematics", "numerical-stability", "compensation-theory", "singular-arithmetic", "formal-verification", "ieee754", "kahan", "agpl"]

[tool.poetry.scripts]
balansis = "balansis.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.5.0"
numpy = "^1.24.0"
matplotlib = {version = "^3.7.0", optional = true}
plotly = {version = "^5.17.0", optional = true}
jupyter = {version = "^1.0.0", optional = true}
ipykernel = {version = "^6.25.0", optional = true}
torch = {version = ">=2.0.0", optional = true}
pyarrow = {version = ">=12.0.0", optional = true}
pandas = {version = ">=2.0.0", optional = true}

[tool.poetry.extras]
plot = ["matplotlib", "plotly"]
notebook = ["jupyter", "ipykernel"]
torch = ["torch"]
arrow = ["pyarrow"]
pandas = ["pandas"]
all = ["matplotlib", "plotly", "jupyter", "ipykernel", "torch", "pyarrow", "pandas"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.7.0"
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
sphinx = "^7.2.0"
sphinx-rtd-theme = "^1.3.0"
nbsphinx = "^0.9.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=balansis --cov-report=term-missing --cov-report=html --cov-fail-under=80"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["balansis"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/examples/*",
    # Optional integrations are exercised by their dedicated test suites.
    "balansis/utils/plot.py",
    "balansis/pandas_ext.py",
    "balansis/vectorized.py",
    "balansis/arrow_integration.py",
    "balansis/memory/*",
    "balansis/ml/*",
    "balansis/native/*",
    "balansis/sets/generators.py",
    "balansis/sets/resolver.py",
    "balansis/algebra/group.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == \"__main__\":",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow"]
ignore_missing_imports = true
