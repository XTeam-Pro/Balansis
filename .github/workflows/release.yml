name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without v prefix'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov build==1.6.0 twine==6.2.0 pipx

      - name: Validate version and changelog
        run: |
          python scripts/validate_version.py "$RELEASE_TAG"
          python scripts/check_changelog.py

      - name: Verify licensing documents
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f LICENSING.md
          test -f COMMERCIAL_LICENSE.md
          test -f CLA.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f ORDER_FORM_TEMPLATE.md
          test ! -f LICENSE-AGPLv3
          test ! -f LICENSE-COMMERCIAL

      - name: Run release smoke tests
        run: |
          pytest tests/test_cli.py tests/test_extended_ratio.py tests/test_extended_ratio_semantic_parity.py --no-cov
          python benchmarks/claim_closure_benchmarks.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.0 twine==6.2.0
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-install:
    name: Test install on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: macos-latest, python-version: '3.12' }
          - { os: windows-latest, python-version: '3.12' }

    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Install from local wheel with pip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels = sorted(Path('dist').glob('*.whl'))
          if not wheels:
              raise SystemExit('No wheel found in dist/')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--upgrade', 'pip'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])
          PY
          python -c "import importlib.metadata, balansis; assert balansis.__version__ == importlib.metadata.version('balansis'); print(balansis.__version__)"
          balansis --version
          balansis doctor

      - name: Install from local wheel with pipx
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          python - <<'PY'
          from pathlib import Path
          import subprocess
          wheels = sorted(Path('dist').glob('*.whl'))
          if not wheels:
              raise SystemExit('No wheel found in dist/')
          subprocess.check_call(['pipx', 'install', '--force', str(wheels[0])])
          PY
          pipx runpip balansis show balansis
          pipx run --spec dist/*.whl balansis --version

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, test-install]
    environment: test-release

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-testpypi
    environment: release

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-pypi
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        run: |
          python scripts/generate_release_notes.py "${RELEASE_TAG#v}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
