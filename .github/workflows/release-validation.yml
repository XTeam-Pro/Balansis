name: Release Validation

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the integrated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/detect_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Check patch integrity
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Check documentation links
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/check_markdown_links.py
          python3 .github/scripts/check_markdown_links.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate workflow and CI helper syntax
        if: steps.scope.outputs.workflow_required == 'true'
        run: |
          python3 -m py_compile .github/scripts/*.py
          ruby -e 'require "yaml"; (Dir[".github/workflows/*.{yml,yaml}"] + [".pre-commit-config.yaml"]).each { |path| YAML.parse_file(path) }'

      - name: Validate version, changelog, and licensing files
        run: |
          python3 scripts/validate_version.py
          python3 scripts/check_changelog.py
          test -f LICENSE
          test -f NOTICE
          test -f LICENSING.md
          test -f COMMERCIAL_LICENSE.md
          test -f CLA.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f ORDER_FORM_TEMPLATE.md

      - name: Set up Python
        if: steps.scope.outputs.python_required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install release-validation tools
        if: steps.scope.outputs.python_required == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            -e . 'pytest>=7.4,<8' 'pytest-cov>=4.1,<5' \
            'flake8>=6.1,<7' 'build==1.6.0' 'twine==6.2.0'

      - name: Lint syntax and undefined names
        if: steps.scope.outputs.python_required == 'true'
        run: flake8 balansis/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run the release test suite
        if: steps.scope.outputs.python_required == 'true'
        run: pytest tests/

      - name: Build and inspect distributions
        if: steps.scope.outputs.python_required == 'true'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the built wheel and public benchmark
        if: steps.scope.outputs.python_required == 'true'
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall "$wheel"
          balansis --version
          balansis doctor
          python benchmarks/claim_closure_benchmarks.py \
            --output /tmp/claim-closure-release-validation.json

      - name: Check the native extension
        if: steps.scope.outputs.native_required == 'true'
        run: cargo check --manifest-path balansis_native/Cargo.toml

      - name: Install the pinned Lean bootstrap
        if: steps.scope.outputs.formal_required == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            --output /tmp/elan-init.sh
          echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh' | sha256sum --check -
          sh /tmp/elan-init.sh -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and audit Lean libraries
        if: steps.scope.outputs.formal_required == 'true'
        run: |
          cd formal
          lake exe cache get
          lake build BalansisFormal
          lake build ACT
          lake env lean FormalAudit.lean
          if grep -Rnw . --include='*.lean' --exclude-dir='.lake' \
            -e '\baxiom\b' -e '\bsorry\b' -e '\badmit\b'; then
            echo "Lean source audit found a forbidden declaration."
            exit 1
          fi
